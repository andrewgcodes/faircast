name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: python -m faircast
      - run: python -m pytest -q tests
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y -q texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science
      - run: make -C paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/main.pdf
            paper/arxiv.tar.gz
